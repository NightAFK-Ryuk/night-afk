<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Night AFK Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow-bg"></div>

  <!-- AUTH SECTION -->
  <div id="auth-container" class="auth-wrapper">
    <div class="auth-card glow-box">
      <h1 class="neon-title">NIGHT AFK</h1>
      <p class="neon-subtitle">24/7 Minecraft Bot Panel</p>
      
      <div class="auth-tabs">
        <button id="tab-login" class="tab-btn active" onclick="switchAuthTab('login')">Sign In</button>
        <button id="tab-register" class="tab-btn" onclick="switchAuthTab('register')">Sign Up</button>
      </div>

      <form id="auth-form" onsubmit="handleAuth(event)">
        <div class="input-group">
          <label>Username</label>
          <input type="text" id="auth-user" required placeholder="Enter username">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="auth-pass" required placeholder="Enter password">
        </div>
        <button type="submit" id="auth-submit-btn" class="btn glow-btn">Sign In</button>
        <p id="auth-error" class="error-msg"></p>
      </form>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="dashboard-container" class="dashboard-wrapper hidden">
    <header class="dashboard-header">
      <div class="logo-area">
        <h1 class="neon-title-small">NIGHT AFK</h1>
        <span class="user-badge" id="logged-user-display">User</span>
      </div>
      <button onclick="logout()" class="btn danger glow-btn-danger">Sign Out</button>
    </header>

    <div class="dashboard-grid">
      <!-- Spawn Panel -->
      <div class="card glow-box">
        <h2>🚀 Spawn New Bot</h2>
        <form id="spawn-form" onsubmit="spawnBot(event)">
          <div class="input-group">
            <label>Server IP:Port</label>
            <input type="text" id="server" placeholder="play.server.com:25565" required>
          </div>
          <div class="input-group">
            <label>Bot Username</label>
            <input type="text" id="username" placeholder="BotName" required>
          </div>
          <div class="input-group">
            <label>Password (Auto Login/Register)</label>
            <input type="password" id="password" placeholder="Server account password">
          </div>
          <div class="input-group">
            <label>SOCKS5 Proxy (Optional)</label>
            <input type="text" id="proxy" placeholder="host:port:user:pass">
          </div>
          <div class="input-group">
            <label>MC Version</label>
            <input type="text" id="version" value="1.8.9">
          </div>
          <button type="submit" class="btn primary glow-btn">Deploy Bot</button>
        </form>
      </div>

      <!-- Quick Controls -->
      <div class="card glow-box">
        <h2>⚙️ Command Console</h2>
        <div class="input-group">
          <label>Target Bot or "all"</label>
          <input type="text" id="target-bot" value="all">
        </div>
        <div class="input-group">
          <label>Chat Message / Command</label>
          <input type="text" id="chat-msg" placeholder="/help or Hello!">
        </div>
        <button onclick="sendChat()" class="btn secondary glow-btn-success">Send Message</button>

        <label style="margin-top: 15px;">Movement Controls</label>
        <div class="movement-grid">
          <button onclick="sendMove('forward')" class="btn">Forward</button>
          <button onclick="sendMove('back')" class="btn">Back</button>
          <button onclick="sendMove('left')" class="btn">Left</button>
          <button onclick="sendMove('right')" class="btn">Right</button>
          <button onclick="sendMove('jump')" class="btn full-span">Jump</button>
        </div>
        <button onclick="disconnectBot()" class="btn danger glow-btn-danger" style="margin-top: 15px;">Disconnect Bot(s)</button>
      </div>
    </div>

    <!-- Active Bots Status -->
    <div class="card full-width glow-box" style="margin-top: 20px;">
      <h2>📊 Your Deployed Bots</h2>
      <div id="bots-container" class="bots-grid">
        <p class="muted">No bots active. Deploy one above!</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
